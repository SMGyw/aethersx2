name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build Core (Final Zlib Override)
        run: |
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          mkdir -p dummy_wx/wx
          
          export LANG=C
          export LC_ALL=C
          
          # 1. PHYSICAL DELETION OF CONFLICTING MACRO
          # We search for the exact line in zlib and delete it physically from the file
          # This is more reliable than 'sed' replacement
          Z_FILE="3rdparty/libchdr/libchdr/deps/zlib-1.2.11/zutil.h"
          if [ -f "$Z_FILE" ]; then
            grep -v "define fdopen" "$Z_FILE" > "${Z_FILE}.tmp" && mv "${Z_FILE}.tmp" "$Z_FILE"
            echo "Successfully purged fdopen macro from zlib."
          fi

          # 2. SOURCE CODE PRE-PROCESSING
          # Fix Wide String issues and common header conflicts
          find common -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.mm" -o -name "*.inl" \) -exec sed -i '' 's/L\(".*"\)/\1/g' {} +
          find common -type f -name "Pcsx2Defs.h" -exec sed -i '' '/typedef std::string wxString;/d' {} +

          # 3. ROBUST BRIDGE HEADER
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <stdio.h>
          #include <string.h>
          #include <string>
          #include <vector>
          #include <stdarg.h>

          // Ensure fdopen is never redefined
          #ifdef fdopen
          #undef fdopen
          #endif

          typedef char wxChar;
          #define _T(x) x
          #define wxT(x) x
          #define _(x) x
          #define __TFILE__ __FILE__

          struct FakeWxString : public std::string {
              using std::string::string;
              FakeWxString(const wchar_t* ws) : std::string("") {}
              const char* wx_str() const { return c_str(); }
              bool Empty() const { return empty(); }
              bool IsEmpty() const { return empty(); }
              static FakeWxString Format(const char* f, ...) {
                  char b[4096]; va_list a; va_start(a, f);
                  vsnprintf(b, sizeof(b), f, a); va_end(a);
                  return FakeWxString(b);
              }
          };
          #define wxString FakeWxString
          #define wxEmptyString FakeWxString("")
          typedef std::vector<FakeWxString> wxArrayString;
          inline const char* pxGetTranslation(const char* m) { return m; }
          #endif
          EOF

          for h in string.h log.h setup.h intl.h crt.h filefn.h config.h chartype.h tokenzr.h buffer.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          cd build
          # Remove SSE flags globally from CMake files before generation
          find .. -name "CMakeLists.txt" -exec sed -i '' 's/-mfpmath=sse//g' {} +
          find .. -name "*.cmake" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DUSE_WXWIDGETS=OFF \
                   -DUSE_OPENGL=OFF \
                   -DUSE_VULKAN=ON \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -include ${GITHUB_WORKSPACE}/dummy_wx/wx_bridge.h -Wno-everything" \
                   -DCMAKE_C_FLAGS="-DHAVE_FDOPEN -Wno-everything"

          # Final cleaning of generated build files
          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          cmake --build . --config Release --verbose -- -j $(sysctl -n hw.logicalcpu)