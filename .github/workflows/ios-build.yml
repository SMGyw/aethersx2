name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Advanced Common Fixes and Build
        run: |
          export LC_ALL=C
          export LANG=C
          
          # 1. Reset and Clean
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          
          # 2. PRO Bridge for WxWidgets (Adding missing types)
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <stdio.h>
          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <algorithm>
          #include <iostream>

          typedef char wxChar;
          typedef std::string wxCharBuffer;
          typedef std::vector<std::string> wxArrayString;
          enum wxStringTokenizerMode { wxTOKEN_RET_EMPTY_ALL };

          #define _T(x) x
          #define wxT(x) x
          #define _(x) x
          #define WX_STR(x) x
          #define wxEmptyString FakeWxString("")

          class FakeWxString : public std::string {
          public:
              using std::string::string;
              FakeWxString(const char* s) : std::string(s ? s : "") {}
              FakeWxString(const std::string& s) : std::string(s) {}
              const char* wx_str() const { return c_str(); }
              const char* c_str() const { return std::string::c_str(); }
              const char* ToUTF8() const { return c_str(); }
              const char* utf8_str() const { return c_str(); }
              bool IsEmpty() const { return empty(); }
              static FakeWxString Format(const char* f, ...) {
                  char b[8192]; va_list a; va_start(a, f);
                  vsnprintf(b, sizeof(b), f, a); va_end(a);
                  return FakeWxString(b);
              }
              operator const char*() const { return c_str(); }
          };
          #define wxString FakeWxString
          #endif
          EOF

          for h in string.h log.h setup.h intl.h crt.h filefn.h config.h chartype.h tokenzr.h buffer.h thread.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          # 3. FIX CORE SOURCE CONFLICTS (The specific fixes for your log)
          # A. Remove conflicting forward declarations
          find common -name "Pcsx2Types.h" -exec sed -i '' '/class wxString;/d' {} +
          
          # B. Fix StringHelpers redeclaration (Remove the wxChar versions to keep char versions)
          find common -name "StringHelpers.h" -exec sed -i '' '/const wxChar\* psz/d' {} +
          find common -name "StringHelpers.h" -exec sed -i '' '/const wxChar\* fmt/d' {} +

          # C. Fix TraceLog return issues
          find common -name "TraceLog.h" -exec sed -i '' 's/return wxEmptyString/return ""/g' {} +

          # 4. Global zlib and cubeb fixes (from previous steps)
          find . -name "zutil.h" -exec sed -i '' '/define fdopen/d' {} +
          find 3rdparty/cubeb -name "cubeb_resampler_internal.h" -exec sed -i '' 's/#define unique_ptr UniquePtr/\/\/ disabled/g' {} +

          # 5. Safe String Surgery
          find . -type d -path "./3rdparty" -prune -o -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.inl" -o -name "*.mm" \) -print0 | xargs -0 sed -i '' 's/L\(\"\)/ \1/g'

          # 6. Configure and Force ARM64
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DUSE_WXWIDGETS=OFF \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -Wno-everything -D__ARM_NEON -std=c++17"
          
          # Force remove x86 specific flags
          find . -name "flags.make" -exec sed -i '' 's/-msse[0-9.]*//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)