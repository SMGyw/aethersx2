name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Comprehensive Bridge Headers
        run: |
          mkdir -p dummy_wx/wx
          
          # إنشاء ملف الجسر الرئيسي
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          
          // تعريف الأنواع الأساسية التي يطلبها المحاكي
          typedef char wxChar;
          class wxString : public std::string {
          public:
              using std::string::string;
              wxString(const std::string& s) : std::string(s) {}
              const char* c_str() const { return std::string::c_str(); }
              bool IsEmpty() const { return empty(); }
              static wxString Format(const char* f, ...) { return wxString(""); }
          };
          
          #define wxT(x) x
          #define _T(x) x
          #define wxEmptyString wxString("")
          typedef std::vector<wxString> wxArrayString;
          #endif
          EOF

          # ربط الملفات المطلوبة بالجسر الرئيسي
          for h in string.h log.h intl.h crt.h tokenzr.h filefn.h gdicmn.h setup.h thread.h app.h event.h msgdlg.h confbase.h fileconf.h; do
            echo '#include "../wx_bridge.h"' > dummy_wx/wx/$h
          done

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build with Surgical Fixes
        run: |
          cd build
          
          # 1. تعطيل استدعاء AppKit في ملفات OpenGL يدويًا قبل البناء
          sed -i '' 's/#import <AppKit\/AppKit.h>/\/\/ disabled AppKit/g' ../common/GL/ContextAGL.h || true
          
          # 2. تشغيل CMake مع إضافة مسار الترويسات الوهمية
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # 3. تنظيف SSE لمنع التعارض مع معمارية ARM
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-msse[0-9.]*//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mfpmath=sse//g' {} +

          make -j$(sysctl -n hw.logicalcpu)