name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Unified Pro Fix and Build
        shell: bash
        run: |
          export PATH="/usr/bin:/bin:/usr/local/bin:$PATH"
          
          # --- خطوة 1: الجراحة البرمجية لفك التعارضات ---
          
          # حذف ماكرو fdopen من zlib لأنه يفسد ملفات stdio.h الخاصة بـ iOS
          /usr/bin/find 3rdparty -name "zutil.h" -exec /usr/bin/sed -i '' '/#[\ ]*define[\ ]*fdopen/d' {} +
          
          # تعطيل Cubeb (INTERFCE trick) لتجنب أخطاء mozilla
          if [ -f 3rdparty/cubeb/CMakeLists.txt ]; then
             echo "project(cubeb)" > 3rdparty/cubeb/CMakeLists.txt
             echo "add_library(cubeb INTERFACE)" >> 3rdparty/cubeb/CMakeLists.txt
          fi
          
          # تعطيل redefinition في Pcsx2Defs.h
          /usr/bin/sed -i '' 's/typedef char wxChar;/\/\/ disabled/g' common/Pcsx2Defs.h
          /usr/bin/sed -i '' 's/typedef std::string wxString;/\/\/ disabled/g' common/Pcsx2Defs.h

          # --- خطوة 2: بناء الجسر (Bridge) كما فعلنا سابقاً ---
          # (ضع هنا كود إنشاء dummy_wx/wx_bridge.h الذي استخدمناه في المرة السابقة)

          # --- خطوة 3: تشغيل CMake والبناء ---
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DHAVE_FDOPEN=1 \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # تنظيف الـ SSE قبل الـ Make
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-msse[0-9.]*//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mfpmath=sse//g' {} +

          make -j$(sysctl -n hw.logicalcpu)