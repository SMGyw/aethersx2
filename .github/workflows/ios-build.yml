name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Advanced Fix - Pro Mode
        run: |
          export LC_ALL=C
          export LANG=C
          
          # 1. Clean Slate
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          
          # 2. THE ADVANCED WX BRIDGE
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          
          #include <stdio.h>
          #include <stdlib.h>
          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <algorithm>
          #include <memory>
          #include <cstring>
          
          // 1. TRICK THE COMPILER: define wxChar as wchar_t to prevent redefinition errors
          // The code has overloads for both char* and wxChar*. Making them different types fixes the conflict.
          typedef wchar_t wxChar;
          
          // 2. Fix wxCharBuffer (Must implicitly convert to const char*)
          struct wxCharBuffer {
              std::string data;
              wxCharBuffer(const std::string& s) : data(s) {}
              wxCharBuffer(const char* s) : data(s ? s : "") {}
              operator const char*() const { return data.c_str(); }
              const char* release() { return strdup(data.c_str()); }
          };
          
          // 3. Enum & Types
          enum wxStringTokenizerMode { wxTOKEN_RET_EMPTY_ALL };
          typedef std::vector<std::string> wxArrayString;
          
          // 4. Missing Macros
          #define _T(x) x
          #define wxT(x) x
          #define _(x) x
          #define WX_STR(x) x
          #define __TFILE__ __FILE__  // Fixes the undeclared identifier error
          
          // 5. The Powerhouse FakeWxString
          class FakeWxString : public std::string {
          public:
              using std::string::string;
              
              FakeWxString() : std::string("") {}
              FakeWxString(const char* s) : std::string(s ? s : "") {}
              FakeWxString(const std::string& s) : std::string(s) {}
              
              // Allow construction from wxCharBuffer
              FakeWxString(const wxCharBuffer& b) : std::string(b.data) {}
              
              // Methods required by PCSX2
              const char* ToUTF8() const { return c_str(); }
              const char* utf8_str() const { return c_str(); }
              const char* wx_str() const { return c_str(); }
              bool IsEmpty() const { return empty(); }
              size_t Length() const { return length(); } // Fixes .Length() error
              
              // Fixes .Replace() error
              size_t Replace(const char* oldStr, const char* newStr, bool all = true) {
                  size_t count = 0;
                  size_t oldLen = strlen(oldStr);
                  size_t newLen = strlen(newStr);
                  size_t pos = 0;
                  while ((pos = find(oldStr, pos)) != std::string::npos) {
                      replace(pos, oldLen, newStr);
                      pos += newLen;
                      count++;
                      if (!all) break;
                  }
                  return count;
              }
              
              // Static formatter
              static FakeWxString Format(const char* f, ...) {
                  char b[8192]; 
                  va_list a; 
                  va_start(a, f);
                  vsnprintf(b, sizeof(b), f, a); 
                  va_end(a);
                  return FakeWxString(b);
              }
          };
          
          // Map wxString
          #define wxString FakeWxString
          #define wxEmptyString FakeWxString("")
          
          // 6. Tokenizer Mock
          class wxStringTokenizer {
          public:
              wxStringTokenizer(const std::string&, const std::string&, wxStringTokenizerMode) {}
          };
          
          #endif
          EOF

          # Populate dummy headers
          for h in string.h log.h setup.h intl.h crt.h filefn.h config.h chartype.h tokenzr.h buffer.h thread.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          # 3. SURGICAL FIXES
          
          # Fix Pcsx2Types.h missing string include
          sed -i '' '1i\
          #include <string>
          ' common/Pcsx2Types.h

          # Remove 'class wxString;' forward declarations
          find common -name "*.h" -exec sed -i '' '/class wxString;/d' {} +
          find common -name "Pcsx2Defs.h" -exec sed -i '' '/typedef std::string wxString;/d' {} +
          
          # Fix Cubeb & Zlib (Standard fixes)
          find . -name "zutil.h" -exec sed -i '' '/define fdopen/d' {} +
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/#include "mozilla\/UniquePtr.h"/#include <memory>/g'
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/mozilla::UniquePtr/std::unique_ptr/g'
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/mozilla::MakeUnique/std::make_unique/g'
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/using mozilla::DefaultDelete;/using std::default_delete;/g'
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/using mozilla::UniquePtr;/using std::unique_ptr;/g'
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/#include "mozilla\/Move.h"//g'
          find 3rdparty/cubeb -name "*.h" -o -name "*.cpp" | xargs sed -i '' 's/mozilla::Move/std::move/g'
          find 3rdparty/cubeb -name "cubeb_resampler_internal.h" -exec sed -i '' 's/#define unique_ptr UniquePtr/\/\/ disabled/g' {} +

          # 4. GLOBAL WIDE CHAR REMOVAL (Crucial since we made wxChar = wchar_t)
          # We need to make sure code doesn't try to assign L"..." to std::string.
          # The bridge handles char, so we strip L prefixes to force everything to char.
          find . -type d -path "./3rdparty" -prune -o -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.inl" -o -name "*.mm" \) -print0 | xargs -0 sed -i '' 's/L\(\"\)/ \1/g'

          # 5. Build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DUSE_WXWIDGETS=OFF \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -Wno-everything -D__ARM_NEON -std=c++17"
          
          # Clean SSE
          find . -name "flags.make" -exec sed -i '' 's/-msse[0-9.]*//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)