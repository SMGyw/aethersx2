name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Unified Pro Fix and Build
        run: |
          # 1. إنشاء جسر wxWidgets احترافي (يحل مشاكل 31%)
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          #include <cstring>

          typedef wchar_t wxChar;
          struct wxCharBuffer {
              std::string d;
              wxCharBuffer(const char* s=nullptr) : d(s?s:"") {}
              const char* data() const { return d.c_str(); }
              operator const char*() const { return d.c_str(); }
          };

          class wxString : public std::string {
          public:
              using std::string::string;
              wxString(const std::string& s) : std::string(s) {}
              wxCharBuffer ToUTF8() const { return wxCharBuffer(c_str()); }
              size_t Length() const { return length(); }
              void Replace(std::string o, std::string n) {
                  size_t p=0; while((p=find(o,p))!=std::string::npos){ replace(p,o.length(),n); p+=n.length(); }
              }
              static wxString Format(const char* f, ...) { return wxString(""); } 
          };
          #define wxT(x) L##x
          #define _T(x) L##x
          #define wxEmptyString wxString("")
          typedef std::vector<wxString> wxArrayString;
          #endif
          EOF

          # 2. إنشاء ملفات ترويسة فارغة لمنع الخطأ في Dependencies.h
          for h in string.h log.h intl.h crt.h tokenzr.h filefn.h; do
            echo '#include "../wx_bridge.h"' > dummy_wx/wx/$h
          done

          # 3. جراحة ملف zlib لمنع خطأ fdopen
          find 3rdparty -name "zutil.h" -exec sed -i '' '/#[\ ]*define[\ ]*fdopen/d' {} +

          # 4. تنظيف ملفات الكود من forward declarations المتعارضة
          sed -i '' 's/class wxString;/#include "wx_bridge.h"/' common/Pcsx2Types.h
          find common -name "*.h" -exec sed -i '' '/class wxString;/d' {} +

          # 5. تشغيل CMake مع تفعيل HAVE_FDOPEN
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DHAVE_FDOPEN=1 \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # 6. حذف تعليمات SSE من كل ملفات البناء (للمكتبات الخارجية مثل fmt)
          find . -name "flags.make" -exec sed -i '' 's/-msse[0-9.]*//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          # 7. البناء النهائي
          make -j$(sysctl -n hw.logicalcpu)