name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build Core
        run: |
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          mkdir -p dummy_wx/wx
          
          export LANG=C
          export LC_ALL=C
          
          # Fix wide string literal conflicts in SafeArray.h
          find common -type f -name "SafeArray.h" -exec sed -i '' 's/L"Unnamed"/"Unnamed"/g' {} +
          
          # Standardize charBuffer naming
          find common -type f \( -name "*.h" -o -name "*.cpp" \) -exec sed -i '' 's/wxCharBuffer/charBuffer/g' {} +
          
          # Remove duplicate function declarations in Console.h and StringHelpers.h
          sed -i '' '118,122d' common/Console.h
          sed -i '' '158,162d' common/Console.h
          sed -i '' '172,175d' common/StringHelpers.h
          sed -i '' '193,196d' common/StringHelpers.h
          sed -i '' '221,224d' common/StringHelpers.h

          # Mock cubeb dependencies
          echo "add_library(cubeb INTERFACE)" > 3rdparty/cubeb/CMakeLists.txt
          echo "add_library(cubeb_resampler INTERFACE)" >> 3rdparty/cubeb/CMakeLists.txt
          
          # Fix zlib fdopen conflict
          ZLIB_ZUTIL="3rdparty/libchdr/libchdr/deps/zlib-1.2.11/zutil.h"
          if [ -f "$ZLIB_ZUTIL" ]; then
            sed -i '' 's/#        define fdopen(fd,mode) NULL/\/\/#define fdopen/g' "$ZLIB_ZUTIL"
          fi

          # Create Master Bridge Header (Pure English)
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <cstring>
          #include <cstdio>

          typedef int wxStringTokenizerMode;
          #define wxTOKEN_RET_EMPTY_ALL 0
          class wxStringTokenizer { public: wxStringTokenizer(...) {} bool HasMoreTokens() const { return false; } std::string GetNextToken() { return ""; } };
          struct wxPoint { int x, y; };
          struct wxSize { int x, y; };

          class charBuffer {
          public:
              std::string data_str;
              charBuffer() {}
              charBuffer(const std::string& s) : data_str(s) {}
              operator const char*() const { return data_str.c_str(); }
              const char* data() const { return data_str.c_str(); }
          };

          class FakeWxString : public std::string {
          public:
              FakeWxString() : std::string("") {}
              FakeWxString(const char* s) : std::string(s ? s : "") {}
              FakeWxString(const std::string& s) : std::string(s) {}
              FakeWxString(const wchar_t* ws) : std::string("") {
                  if (ws) { std::wstring w(ws); for (wchar_t x : w) this->push_back((char)x); }
              }
              operator const char*() const { return c_str(); }
              const char* wx_str() const { return c_str(); }
              charBuffer ToUTF8() const { return charBuffer(*this); }
              bool Empty() const { return empty(); }
              static FakeWxString Format(const char* fmt, ...) {
                  char buf[2048]; va_list args; va_start(args, fmt);
                  vsnprintf(buf, sizeof(buf), fmt, args); va_end(args);
                  return FakeWxString(buf);
              }
          };

          #undef wxString
          #define wxString FakeWxString
          typedef char wxChar;
          typedef std::vector<FakeWxString> wxArrayString;
          #define wxT(x) x
          #define _(x) x
          #define wxEmptyString FakeWxString("")
          #define wxLogMessage(...) 
          #endif
          EOF

          for h in tokenzr.h string.h log.h setup.h intl.h crt.h msgdlg.h filefn.h config.h thread.h chartype.h buffer.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          cd build
          
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_SYSTEM_PROCESSOR=arm64 \
                   -DUSE_CUBEB=OFF -DBUILD_CUBEB=OFF \
                   -DUSE_WXWIDGETS=OFF -DUSE_OPENGL=OFF -DUSE_VULKAN=ON \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -include ${GITHUB_WORKSPACE}/dummy_wx/wx_bridge.h -DwxString=FakeWxString" \
                   -DCMAKE_C_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx"

          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-msse[^ ]*//g' {} +

          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)