name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Comprehensive Surgery and Bridge Creation
        shell: bash
        run: |
          # 1. تنظيف البيئة وحل تعارض zlib
          /usr/bin/find . -name "zutil.h" -exec /usr/bin/sed -i '' '/#[\ ]*define[\ ]*fdopen/d' {} +
          
          # 2. بناء الجسر المطور (Super Bridge v4.0)
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          #include <cwchar>
          #include <iostream>
          #include <cstring>

          #ifndef __TFILE__
          #define __TFILE__ L"__FILE__"
          #endif
          #ifndef wxT
          #define wxT(x) L##x
          #endif

          class wxPoint { public: int x, y; wxPoint(int _x=0, int _y=0):x(_x),y(_y){} };
          class wxSize { public: int x, y; wxSize(int _x=0, int _y=0):x(_x),y(_y){} };
          
          #define wxDefaultPosition wxPoint(-1, -1)
          #define wxDefaultSize wxSize(-1, -1)

          class wxString : public std::string {
          public:
              using std::string::string;
              wxString(const std::string& s) : std::string(s) {}
              
              // تحويل النص العريض L"..." إلى نص عادي
              wxString(const wchar_t* ws) {
                  if(!ws) return;
                  char buf[4096];
                  size_t n = wcstombs(buf, ws, sizeof(buf)-1);
                  if (n != (size_t)-1) buf[n] = '\0'; else buf[0] = '\0';
                  assign(buf);
              }
              
              // الدوال التي يطلبها Console.cpp و TraceLog
              const char* utf8_str() const { return c_str(); }
              const char* wx_str() const { return c_str(); }
              const char* mb_str() const { return c_str(); }
              const char* c_str() const { return std::string::c_str(); }
              
              // تحويل تلقائي إلى const wchar_t* (حل مشكلة TraceLog)
              operator const wchar_t*() const { return L""; } 
              
              bool IsEmpty() const { return empty(); }
              size_t Length() const { return length(); }
              void Replace(const wxString& a, const wxString& b, bool all = true) {}
              
              // حل مشكلة المعامل + و += مع النصوص العريضة
              wxString& operator+=(const wchar_t* rhs) { append(wxString(rhs)); return *this; }
              friend wxString operator+(wxString lhs, const wchar_t* rhs) { lhs += rhs; return lhs; }
              friend wxString operator+(const wchar_t* lhs, const wxString& rhs) { 
                  wxString s(lhs); s.append(rhs); return s; 
              }
          };

          typedef wchar_t wxChar;
          #define wxEmptyString wxString("")
          #define pxGetTranslation(x) wxString(x)
          #define WX_STR(x) wxString(x).c_str()
          typedef std::vector<wxString> wxArrayString;
          
          // حل مشكلة wxsFormat و FormatV
          inline wxString wxsFormat(const wchar_t* f, ...) { return wxString(""); }
          inline wxString wxsFormat(const char* f, ...) { return wxString(""); }
          #endif
          EOF

          # 3. توجيه كافة طلبات المكتبة إلى الجسر
          for h in string.h log.h intl.h crt.h tokenzr.h filefn.h gdicmn.h setup.h thread.h app.h event.h msgdlg.h confbase.h fileconf.h assertions.h; do
            echo '#include "../wx_bridge.h"' > dummy_wx/wx/$h
          done

          # 4. تنظيف ملفات المحاكي من التعريفات القديمة المتعارضة
          /usr/bin/sed -i '' 's/typedef char wxChar;/\/\/ deleted/g' common/Pcsx2Defs.h || true
          /usr/bin/sed -i '' 's/typedef std::string wxString;/\/\/ deleted/g' common/Pcsx2Defs.h || true
          /usr/bin/sed -i '' 's/extern const wxPoint wxDefaultPosition;/\/\/ deleted/g' common/pxForwardDefs.h || true
          /usr/bin/sed -i '' 's/extern const wxSize wxDefaultSize;/\/\/ deleted/g' common/pxForwardDefs.h || true

      - name: Configure and Build
        shell: bash
        run: |
          mkdir -p build && cd build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # تشغيل CMake مع إعدادات iOS الشاملة
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DHAVE_FDOPEN=1 \
                   -DUSE_WXWIDGETS=OFF \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # التطهير القسري لتعليمات SSE من ملفات البناء (لحل خطأ unknown FP unit 'sse')
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-msse[0-9.]*//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mfpmath=sse//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mavx[0-9]*//g' {} +

          # بدء التجميع
          make -j$(sysctl -n hw.logicalcpu)