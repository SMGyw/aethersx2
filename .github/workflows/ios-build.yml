name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Surgical Fix with Encoding Support
        run: |
          # 1. إعداد البيئة لتجنب أخطاء sed
          export LC_ALL=C
          export LANG=C
          
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          
          # 2. بناء الجسر المتقدم
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <stdio.h>
          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <algorithm>

          typedef char wxChar;
          #define _T(x) x
          #define wxT(x) x
          #define _(x) x
          #define __TFILE__ __FILE__
          #define WX_STR(x) x
          #define wxEmptyString FakeWxString("")

          class FakeWxString : public std::string {
          public:
              using std::string::string;
              FakeWxString(const char* s) : std::string(s ? s : "") {}
              FakeWxString(const std::string& s) : std::string(s) {}
              
              const char* wx_str() const { return c_str(); }
              const char* ToUTF8() const { return c_str(); }
              const char* utf8_str() const { return c_str(); }
              const char* c_str() const { return std::string::c_str(); }
              
              bool Empty() const { return empty(); }
              bool IsEmpty() const { return empty(); }
              size_t Length() const { return length(); }
              
              void Replace(const std::string& old_s, const std::string& new_s) {
                  size_t pos = 0;
                  while((pos = this->find(old_s, pos)) != std::string::npos) {
                      this->replace(pos, old_s.length(), new_s);
                      pos += new_s.length();
                  }
              }

              static FakeWxString Format(const char* f, ...) {
                  char b[8192]; va_list a; va_start(a, f);
                  vsnprintf(b, sizeof(b), f, a); va_end(a);
                  return FakeWxString(b);
              }
          };
          #define wxString FakeWxString
          #endif
          EOF

          for h in string.h log.h setup.h intl.h crt.h filefn.h config.h chartype.h tokenzr.h buffer.h thread.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          # 3. تعديل الكود المصدري مع تجاوز أخطاء الترميز
          # حذف حرف L من أمام النصوص العريضة
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.inl" -o -name "*.mm" \) -print0 | xargs -0 sed -i '' 's/L\([\"'\'']\)/\1/g'

          # حذف الدوال المكررة التي تسبب Redefinition
          find common -name "TraceLog.h" -exec sed -i '' '/const wxChar\* fmt/d' {} +
          find common -name "Console.h" -exec sed -i '' '/const wxChar\* fmt/d' {} +
          
          # حذف كتل الدوال التي تستخدم wxChar في ملفات cpp
          find common -name "*.cpp" -exec sed -i '' '/wxChar\* fmt/,/}/d' {} +

          # 4. التكوين والبناء
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DUSE_WXWIDGETS=OFF \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -Wno-everything"
          
          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)