name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build Core
        run: |
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          mkdir -p dummy_wx/wx
          
          export LANG=C
          export LC_ALL=C
          
          # 1. NEW STRATEGY: Patch zlib's CMake and Headers globally
          # This will find ALL zutil.h files and comment out the fdopen macro regardless of spacing
          find . -name "zutil.h" -exec sed -i '' 's/.*define.*fdopen.*NULL/\/\/#define fdopen/g' {} +
          
          # Force define HAVE_FDOPEN in the actual zconf.h if it exists
          find . -name "zconf.h" -exec sh -c 'echo "#define HAVE_FDOPEN 1" >> $1' _ {} \;

          # 2. REMOVE CONFLICTING TYPEDEFS IN SOURCE
          find common -type f -name "Pcsx2Defs.h" -exec sed -i '' '/typedef std::string wxString;/d' {} +
          find common -type f -name "Pcsx2Types.h" -exec sed -i '' '/class wxString;/d' {} +
          
          # 3. GLOBAL WIDE-STRING TO ASCII CONVERSION
          find common -type f \( -name "*.h" -o -name "*.cpp" -o -name "*.mm" \) -exec sed -i '' 's/L\(".*"\)/\1/g' {} +
          
          # 4. FIX DUPLICATE DECLARATIONS & SYNTAX
          find common -type f -name "StringHelpers.h" -exec sed -i '' '/const wxChar\* psz/d' {} +
          find common -type f -name "Console.h" -exec sed -i '' '/const wxChar\* fmt/d' {} +
          find common -type f -name "TraceLog.h" -exec sed -i '' '/const wxChar\* fmt/d' {} +
          find common -type f -name "StringHelpers.h" -exec sed -i '' 's/operator+=(const char\* psz);/operator+=(const char* psz) { return *this; }/g' {} +

          # 5. MOCK CUBEB
          echo "add_library(cubeb INTERFACE)" > 3rdparty/cubeb/CMakeLists.txt
          echo "add_library(cubeb_resampler INTERFACE)" >> 3rdparty/cubeb/CMakeLists.txt
          
          # 6. MASTER BRIDGE HEADER (With explicit fdopen protection)
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          
          #include <stdio.h> // Include this first
          #ifdef fdopen
          #undef fdopen
          #endif

          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <cstring>

          typedef int wxStringTokenizerMode;
          #define wxTOKEN_RET_EMPTY_ALL 0
          class wxStringTokenizer { public: wxStringTokenizer(...) {} bool HasMoreTokens() const { return false; } std::string GetNextToken() { return ""; } };
          struct wxPoint { int x, y; };
          struct wxSize { int x, y; };

          class charBuffer {
          public:
              std::string data_str;
              charBuffer() {}
              charBuffer(const std::string& s) : data_str(s) {}
              operator const char*() const { return data_str.c_str(); }
              const char* data() const { return data_str.c_str(); }
          };

          class FakeWxString : public std::string {
          public:
              FakeWxString() : std::string("") {}
              FakeWxString(const char* s) : std::string(s ? s : "") {}
              FakeWxString(const std::string& s) : std::string(s) {}
              FakeWxString(const wchar_t* ws) : std::string("") {} 
              operator const char*() const { return c_str(); }
              const char* wx_str() const { return c_str(); }
              charBuffer ToUTF8() const { return charBuffer(*this); }
              bool Empty() const { return empty(); }
              static FakeWxString Format(const char* fmt, ...) {
                  char buf[2048]; va_list args; va_start(args, fmt);
                  vsnprintf(buf, sizeof(buf), fmt, args); va_end(args);
                  return FakeWxString(buf);
              }
          };

          #define wxString FakeWxString
          #define wxsFormat FakeWxString::Format
          #define WX_STR(x) (x)
          typedef char wxChar;
          typedef std::vector<FakeWxString> wxArrayString;
          #define wxT(x) x
          #define _(x) x
          #define wxEmptyString FakeWxString("")
          #define wxLogMessage(...) 
          #define pxGetTranslation(x) (x)
          #endif
          EOF

          for h in tokenzr.h string.h log.h setup.h intl.h crt.h msgdlg.h filefn.h config.h thread.h chartype.h buffer.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_SYSTEM_PROCESSOR=arm64 \
                   -DUSE_CUBEB=OFF -DBUILD_CUBEB=OFF \
                   -DUSE_WXWIDGETS=OFF -DUSE_OPENGL=OFF -DUSE_VULKAN=ON \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -include ${GITHUB_WORKSPACE}/dummy_wx/wx_bridge.h" \
                   -DCMAKE_C_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -DHAVE_FDOPEN"

          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-msse[^ ]*//g' {} +

          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)