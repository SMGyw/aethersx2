name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build Core
        run: |
          # 1. CLEAN RESET
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          mkdir -p dummy_wx/wx
          
          # 2. FORCE DISABLE INTERNAL LIBRARIES
          for lib in zlib-1.2.11 cubeb; do
            dir="3rdparty/$lib"
            [ "$lib" == "zlib-1.2.11" ] && dir="3rdparty/libchdr/libchdr/deps/zlib-1.2.11"
            if [ -d "$dir" ]; then
              echo "cmake_minimum_required(VERSION 3.10)" > $dir/CMakeLists.txt
              echo "project(${lib}_dummy)" >> $dir/CMakeLists.txt
              echo "add_library(${lib} INTERFACE)" >> $dir/CMakeLists.txt
            fi
          done

          # 3. GLOBAL SOURCE CLEANUP
          find . -name "Pcsx2Defs.h" -exec sed -i '' '/typedef std::string wxString/d' {} +
          find . -name "Pcsx2Types.h" -exec sed -i '' '/class wxString/d' {} +

          # 4. ENHANCED BRIDGE HEADER (Fixing String & Wchar issues)
          cat <<EOF > dummy_wx/wx_bridge.h
          #pragma once
          #include <string>
          #include <vector>
          #include <iostream>

          #ifndef WX_BRIDGE_INCLUDED
          #define WX_BRIDGE_INCLUDED

          // Fix for L"text" issues: define wxString as a class that handles wchar_t
          class wxString : public std::string {
          public:
              wxString() : std::string("") {}
              wxString(const char* s) : std::string(s ? s : "") {}
              wxString(const std::string& s) : std::string(s) {}
              // Handle wchar_t by converting (dummy conversion for build)
              wxString(const wchar_t* ws) : std::string("") {
                  if (ws) {
                      std::wstring w(ws);
                      for (char x : w) this->push_back((char)x);
                  }
              }
              const char* c_str() const { return std::string::c_str(); }
              std::string ToUTF8() const { return *this; }
              bool Empty() const { return empty(); }
          };

          typedef char wxChar;
          typedef wxString wxCharBuffer;
          typedef std::vector<wxString> wxArrayString;
          typedef int wxStringTokenizerMode;

          #define wxT(x) x
          #define _(x) x
          #define L(x) x
          #define wxEmptyString wxString("")
          #define wxTOKEN_RET_EMPTY_ALL 0
          #define wxLogMessage(...) 
          #define wxLogStatus(...)
          #define wxUnusedVar(x) (void)x

          class wxThread { public: virtual ~wxThread() {} virtual void* Entry() = 0; };
          class wxMutex { public: void Lock() {} void Unlock() {} };
          class wxCriticalSection { public: void Enter() {} void Leave() {} };
          #endif
          EOF

          # 5. MOCK WX HEADERS
          for h in tokenzr.h string.h log.h setup.h intl.h crt.h msgdlg.h filefn.h config.h thread.h chartype.h buffer.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          cd build
          
          # 6. CONFIGURE
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DUSE_CUBEB=OFF -DBUILD_CUBEB=OFF \
                   -DUSE_WXWIDGETS=OFF -DUSE_OPENGL=OFF -DUSE_VULKAN=ON \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -include ${GITHUB_WORKSPACE}/dummy_wx/wx_bridge.h" \
                   -DCMAKE_C_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DPCSX2_USE_PCH=OFF

          # 7. STRIP INTEL FLAGS
          find . -name "*.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +
          find . -name "*.make" -exec sed -i '' 's/-msse[^ ]*//g' {} +
          
          # 8. START BUILD
          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)