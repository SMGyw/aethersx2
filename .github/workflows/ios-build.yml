name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build Core
        run: |
          # 1. CLEAN RESET
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          mkdir -p dummy_wx/wx
          
          # 2. FIX LOCALE
          export LANG=C
          export LC_ALL=C
          
          # 3. GLOBAL SOURCE CLEANUP
          find . -type f \( -name "StringHelpers.h" -o -name "Console.h" -o -name "SafeArray.h" \) -print0 | xargs -0 sed -i '' '/const wxChar\* fmt/d' || true
          find . -type f \( -name "StringHelpers.h" -o -name "Console.h" -o -name "SafeArray.h" \) -print0 | xargs -0 sed -i '' '/const wxChar\* psz/d' || true
          find . -type f \( -name "StringHelpers.h" -o -name "Console.h" -o -name "SafeArray.h" \) -print0 | xargs -0 sed -i '' '/const wxChar\* name/d' || true
          find . -type f -name "SafeArray.h" -exec sed -i '' 's/L"Unnamed"/"Unnamed"/g' {} +

          # 4. NUCLEAR OPTION FOR CUBEB (Solving mozilla/UniquePtr.h once and for all)
          # We empty the CMake file and provide a dummy target
          echo "add_library(cubeb INTERFACE)" > 3rdparty/cubeb/CMakeLists.txt
          echo "add_library(cubeb_resampler INTERFACE)" >> 3rdparty/cubeb/CMakeLists.txt
          
          # 5. FIX ZLIB CONFLICT
          ZLIB_ZUTIL="3rdparty/libchdr/libchdr/deps/zlib-1.2.11/zutil.h"
          if [ -f "$ZLIB_ZUTIL" ]; then
            sed -i '' 's/#        define fdopen(fd,mode) NULL/\/\/#define fdopen/g' "$ZLIB_ZUTIL"
          fi

          # 6. THE MASTER BRIDGE
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <cstring>
          class FakeWxString : public std::string {
          public:
              FakeWxString() : std::string("") {}
              FakeWxString(const char* s) : std::string(s ? s : "") {}
              FakeWxString(const std::string& s) : std::string(s) {}
              FakeWxString(const wchar_t* ws) : std::string("") {
                  if (ws) {
                      std::wstring w(ws);
                      for (wchar_t x : w) this->push_back((char)x);
                  }
              }
              operator const char*() const { return c_str(); }
              const char* c_str() const { return std::string::c_str(); }
              std::string ToUTF8() const { return *this; }
              bool Empty() const { return empty(); }
          };
          #undef wxString
          #define wxString FakeWxString
          typedef char wxChar;
          typedef wxString wxCharBuffer;
          typedef std::vector<wxString> wxArrayString;
          class wxStringTokenizer {
          public:
              wxStringTokenizer(const wxString& s, const wxString& d) {}
              bool HasMoreTokens() const { return false; }
              wxString GetNextToken() { return wxString(""); }
          };
          typedef int wxStringTokenizerMode;
          #define wxT(x) x
          #define _(x) x
          #define wxEmptyString FakeWxString("")
          #define wxTOKEN_RET_EMPTY_ALL 0
          #define wxLogMessage(...) 
          #define wxLogStatus(...)
          #define wxUnusedVar(x) (void)x
          struct wxPoint { int x, y; };
          struct wxSize { int x, y; };
          #endif
          EOF

          # 7. MOCK WX HEADERS
          for h in tokenzr.h string.h log.h setup.h intl.h crt.h msgdlg.h filefn.h config.h thread.h chartype.h buffer.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          cd build
          
          # 8. CONFIGURE
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DUSE_CUBEB=OFF -DBUILD_CUBEB=OFF \
                   -DUSE_WXWIDGETS=OFF -DUSE_OPENGL=OFF -DUSE_VULKAN=ON \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -include ${GITHUB_WORKSPACE}/dummy_wx/wx_bridge.h" \
                   -DCMAKE_C_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx"

          # 9. STRIP FLAGS
          find . -name "*.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +
          find . -name "*.make" -exec sed -i '' 's/-msse[^ ]*//g' {} +
          
          # 10. START BUILD
          cmake --build . --config Release -- -j $(sysctl -n hw.logicalcpu)