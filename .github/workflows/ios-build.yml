name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Comprehensive Surgery and Bridge Creation
        shell: bash
        run: |
          export PATH="/usr/bin:/bin:/usr/local/bin:$PATH"
          
          # 1. تعطيل المكتبات الخارجية المسببة للمشاكل (مثل cubeb)
          if [ -d "3rdparty/cubeb" ]; then
            echo "project(cubeb)" > 3rdparty/cubeb/CMakeLists.txt
            echo "add_library(cubeb INTERFACE)" >> 3rdparty/cubeb/CMakeLists.txt
          fi
          
          # 2. حل تعارض zlib مع Xcode 16+
          /usr/bin/find . -name "zutil.h" -exec /usr/bin/sed -i '' '/#[\ ]*define[\ ]*fdopen/d' {} +
          
          # 3. بناء الجسر الخارق (The Super Bridge) لدعم Unicode والعمليات النصية
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          #include <cwchar>
          #include <iostream>
          #include <cstring>

          // تعريف الماكروس المطلوبة للـ Assertions والملفات
          #ifndef __TFILE__
          #define __TFILE__ L"__FILE__"
          #endif
          #ifndef _T
          #define _T(x) L##x
          #endif
          #ifndef wxT
          #define wxT(x) L##x
          #endif

          class wxPoint { public: int x, y; wxPoint(int _x=0, int _y=0):x(_x),y(_y){} };
          class wxSize { public: int x, y; wxSize(int _x=0, int _y=0):x(_x),y(_y){} };
          class wxRect { public: int x, y, w, h; wxRect(int _x=0,int _y=0,int _w=0,int _h=0):x(_x),y(_y),w(_w),h(_h){} };
          
          static const wxPoint wxDefaultPositionInternal(-1, -1);
          static const wxSize wxDefaultSizeInternal(-1, -1);
          #define wxDefaultPosition wxDefaultPositionInternal
          #define wxDefaultSize wxDefaultSizeInternal

          class wxString : public std::string {
          public:
              using std::string::string;
              wxString(const std::string& s) : std::string(s) {}
              // تحويل من wchar_t* إلى string عادي (حل أخطاء VirtualMemory)
              wxString(const wchar_t* ws) {
                  if(!ws) return;
                  char buf[4096];
                  size_t n = wcstombs(buf, ws, sizeof(buf)-1);
                  if (n != (size_t)-1) buf[n] = '\0'; else buf[0] = '\0';
                  assign(buf);
              }
              
              // الدوال المفقودة في Console.cpp و TraceLog
              const char* utf8_str() const { return c_str(); }
              const char* wx_str() const { return c_str(); }
              const char* mb_str() const { return c_str(); }
              const char* c_str() const { return std::string::c_str(); }
              bool IsEmpty() const { return empty(); }
              size_t Length() const { return length(); }
              void Replace(const wxString& a, const wxString& b, bool all = true) {}
              wxString FormatDiagnosticMessage() const { return *this; }
              const char* DiagMsg() const { return c_str(); }
              std::string& DiagMsg() { return *this; }

              // حل مشكلة المعامل + و += مع النصوص L"..."
              wxString& operator+=(const wchar_t* rhs) { append(wxString(rhs)); return *this; }
              friend wxString operator+(wxString lhs, const wchar_t* rhs) { lhs += rhs; return lhs; }
              friend wxString operator+(const wchar_t* lhs, const wxString& rhs) { 
                  wxString s(lhs); s.append(rhs); return s; 
              }
          };

          typedef wchar_t wxChar;
          #define wxEmptyString wxString("")
          #define pxGetTranslation(x) wxString(x)
          #define WX_STR(x) wxString(x).c_str()
          typedef std::vector<wxString> wxArrayString;
          class wxStringTokenizer { public: wxStringTokenizer(...){} wxString GetNextToken(){return "";} bool HasMoreTokens(){return false;} };
          #define wxTOKEN_RET_EMPTY_ALL 0
          #endif
          EOF

          # 4. ربط كل ملفات wx المفقودة بالجسر
          for h in string.h log.h intl.h crt.h tokenzr.h filefn.h gdicmn.h setup.h thread.h app.h event.h msgdlg.h confbase.h fileconf.h assertions.h; do
            echo '#include "../wx_bridge.h"' > dummy_wx/wx/$h
          done

          # 5. تنظيف التعريفات المتعارضة في الكود
          /usr/bin/sed -i '' 's/typedef char wxChar;/\/\/ disabled/g' common/Pcsx2Defs.h || true
          /usr/bin/sed -i '' 's/typedef std::string wxString;/\/\/ disabled/g' common/Pcsx2Defs.h || true
          /usr/bin/sed -i '' 's/extern const wxPoint wxDefaultPosition;/\/\/ removed/g' common/pxForwardDefs.h || true
          /usr/bin/sed -i '' 's/extern const wxSize wxDefaultSize;/\/\/ removed/g' common/pxForwardDefs.h || true

      - name: Configure and Build
        shell: bash
        run: |
          mkdir -p build && cd build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # تشغيل CMake مع إعدادات iOS الشاملة
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DHAVE_FDOPEN=1 \
                   -DUSE_WXWIDGETS=OFF \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # التطهير القسري لتعليمات SSE من ملفات البناء (لحل خطأ unknown FP unit 'sse')
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-msse[0-9.]*//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mfpmath=sse//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mavx[0-9]*//g' {} +

          # بدء التجميع
          make -j$(sysctl -n hw.logicalcpu)