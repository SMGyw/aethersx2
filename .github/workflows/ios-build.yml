name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build and Force ARM NEON
        run: |
          cd build
          # 1. إعادة تشغيل CMake مع التأكد من إيقاف SSE تماماً
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DPCSX2_TARGET_ARCH_ARM=1 \
                   -D__ARM_NEON=1 \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # 2. حيلة قوية: البحث في كل ملفات flags.make وحذف تعليمات sse قسرياً
          # هذه الخطوة تعالج أخطاء المكتبات الخارجية مثل fmt و glslang
          find . -name "flags.make" -exec sed -i '' 's/-msse[0-9.]*//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +
          find . -name "flags.make" -exec sed -i '' 's/-march=native//g' {} +

          # 3. البدء بالبناء
          make -j$(sysctl -n hw.logicalcpu)