name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Comprehensive Surgery and Bridge Creation
        shell: bash
        run: |
          export PATH="/usr/bin:/bin:/usr/local/bin:$PATH"
          
          # 1. تعطيل cubeb
          if [ -d "3rdparty/cubeb" ]; then
            echo "project(cubeb)" > 3rdparty/cubeb/CMakeLists.txt
            echo "add_library(cubeb INTERFACE)" >> 3rdparty/cubeb/CMakeLists.txt
          fi
          
          # 2. حل مشكلة zlib
          /usr/bin/find . -name "zutil.h" -exec /usr/bin/sed -i '' '/#[\ ]*define[\ ]*fdopen/d' {} +
          
          # 3. تحديث الجسر (Bridge) - نسخة "الاستقرار التام"
          mkdir -p dummy_wx/wx
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <string>
          #include <vector>
          #include <cstring>
          #include <cwchar>

          // تعريف الكلاسات أولاً
          class wxPoint { public: int x, y; wxPoint(int _x=0, int _y=0):x(_x),y(_y){} };
          class wxSize { public: int x, y; wxSize(int _x=0, int _y=0):x(_x),y(_y){} };
          class wxRect { public: int x, y, w, h; wxRect(int _x=0,int _y=0,int _w=0,int _h=0):x(_x),y(_y),w(_w),h(_h){} };

          // تعريف الثوابت كقيم ثابتة وليس ماكرو لتجنب أخطاء التكرار
          static const wxPoint wxDefaultPositionInternal(-1, -1);
          static const wxSize wxDefaultSizeInternal(-1, -1);
          static const wxRect wxDefaultRectInternal(-1, -1, -1, -1);

          #define wxDefaultPosition wxDefaultPositionInternal
          #define wxDefaultSize wxDefaultSizeInternal
          #define wxDefaultRect wxDefaultRectInternal

          class wxStringTokenizer { public: wxStringTokenizer(...){} };
          enum wxStringTokenizerMode { wxTOKEN_RET_EMPTY_ALL };

          struct wxCharBuffer {
              std::string d;
              wxCharBuffer(const char* s=nullptr) : d(s?s:"") {}
              const char* data() const { return d.c_str(); } // إضافة دالة data الصريحة
              operator const char*() const { return d.c_str(); }
          };

          class wxString : public std::string {
          public:
              using std::string::string;
              wxString(const std::string& s) : std::string(s) {}
              wxString(const wchar_t* ws) {
                  if(!ws) return;
                  char buf[1024];
                  size_t res = wcstombs(buf, ws, 1024);
                  if(res != (size_t)-1) assign(buf);
              }
              wxCharBuffer ToUTF8() const { return wxCharBuffer(c_str()); }
              bool IsEmpty() const { return empty(); }
              size_t Length() const { return length(); }
              static wxString Format(const char* f, ...) { return wxString(""); }
              void Replace(...) {}
          };

          typedef wchar_t wxChar;
          #define wxT(x) L##x
          #define _T(x) L##x
          #define wxEmptyString wxString("")
          typedef std::vector<wxString> wxArrayString;
          #endif
          EOF

          # 4. توليد ملفات dummy
          for h in string.h log.h intl.h crt.h tokenzr.h filefn.h gdicmn.h setup.h thread.h app.h event.h msgdlg.h confbase.h fileconf.h; do
            echo '#include "../wx_bridge.h"' > dummy_wx/wx/$h
          done

          # 5. جراحة لتعطيل ملفات الماك وتعريفات wx المتكررة
          /usr/bin/sed -i '' 's/typedef char wxChar;/\/\/ disabled/g' common/Pcsx2Defs.h || true
          /usr/bin/sed -i '' 's/typedef std::string wxString;/\/\/ disabled/g' common/Pcsx2Defs.h || true
          
          # مسح ملفات OpenGL الماك تماماً
          echo "// Disabled for iOS" > common/GL/ContextAGL.mm
          echo "// Disabled for iOS" > common/GL/ContextAGL.h
          
          # تعديل StringHelpers و pxForwardDefs لحذف التعريفات المتعارضة
          /usr/bin/sed -i '' 's/extern const wxPoint wxDefaultPosition;/\/\/ removed/g' common/pxForwardDefs.h || true
          /usr/bin/sed -i '' 's/extern const wxSize wxDefaultSize;/\/\/ removed/g' common/pxForwardDefs.h || true
          /usr/bin/sed -i '' 's/extern const wxRect wxDefaultRect;/\/\/ removed/g' common/StringHelpers.h || true

      - name: Configure and Build
        shell: bash
        run: |
          mkdir -p build && cd build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # تشغيل CMake مع إعدادات iOS الشاملة
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=iOS \
                   -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DHAVE_FDOPEN=1 \
                   -DUSE_WXWIDGETS=OFF \
                   -DCMAKE_CXX_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx" \
                   -DCMAKE_C_FLAGS="-w -I${GITHUB_WORKSPACE}/dummy_wx"

          # التطهير القسري لتعليمات SSE من ملفات البناء (لحل خطأ unknown FP unit 'sse')
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-msse[0-9.]*//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mfpmath=sse//g' {} +
          /usr/bin/find . -name "flags.make" -exec /usr/bin/sed -i '' 's/-mavx[0-9]*//g' {} +

          # بدء التجميع
          make -j$(sysctl -n hw.logicalcpu)