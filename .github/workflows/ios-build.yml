name: iOS Build Test
on: [push, pull_request]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CMake and Dependencies
        run: |
          brew install cmake ninja

      - name: Create Dummy wxWidgets Headers
        run: |
          mkdir -p dummy_wx/wx
          touch dummy_wx/wx/string.h
          touch dummy_wx/wx/log.h
          touch dummy_wx/wx/thread.h
          touch dummy_wx/wx/gdicmn.h
          touch dummy_wx/wx/msgdlg.h
          touch dummy_wx/wx/app.h
          touch dummy_wx/wx/confbase.h
          touch dummy_wx/wx/fileconf.h
          touch dummy_wx/wx/event.h

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Current iOS SDK Path: $IOS_SDK_PATH"
          
          cmake -S . -B build \
            -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$IOS_SDK_PATH \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_WXWIDGETS=OFF \
            -DPCSX2_CORE=ON \
            -DENABLE_SETCAP=OFF

      - name: Build Core (Fixing Cubeb & Mozilla Dependencies)
        run: |
          git checkout .
          git clean -fd
          rm -rf build && mkdir build
          
          # 1. CREATE DUMMY STRUCTURES
          mkdir -p dummy_wx/wx
          mkdir -p dummy_wx/mozilla
          
          # Create a Fake UniquePtr for Mozilla
          cat <<EOF > dummy_wx/mozilla/UniquePtr.h
          #ifndef MOZILLA_UNIQUEPTR_H
          #define MOZILLA_UNIQUEPTR_H
          #include <memory>
          namespace mozilla {
              template<typename T> using UniquePtr = std::unique_ptr<T>;
              template<typename T> struct DefaultDelete : std::default_delete<T> {};
          }
          #endif
          EOF

          # 2. PATCH CUBEB SOURCE DIRECTLY
          # Remove the Gecko build flag that triggers Mozilla dependency
          find 3rdparty/cubeb -name "CMakeLists.txt" -exec sed -i '' 's/CUBEB_GECKO_BUILD/DISABLE_GECKO/g' {} +
          # Comment out the problematic include in the source file
          find 3rdparty/cubeb -name "cubeb_resampler_internal.h" -exec sed -i '' 's/#include "mozilla\/UniquePtr.h"/#include <memory>/g' {} +

          # 3. PURGE ZLIB FDOPEN (Our previous success)
          Z_FILE="3rdparty/libchdr/libchdr/deps/zlib-1.2.11/zutil.h"
          if [ -f "$Z_FILE" ]; then
            grep -v "define fdopen" "$Z_FILE" > "${Z_FILE}.tmp" && mv "${Z_FILE}.tmp" "$Z_FILE"
          fi

          # 4. ROBUST BRIDGE HEADER
          cat <<EOF > dummy_wx/wx_bridge.h
          #ifndef WX_BRIDGE_H
          #define WX_BRIDGE_H
          #include <stdio.h>
          #include <string>
          #include <vector>
          #include <stdarg.h>
          #include <memory>

          #ifdef fdopen
          #undef fdopen
          #endif

          typedef char wxChar;
          #define _T(x) x
          #define wxT(x) x
          #define _(x) x

          class FakeWxString : public std::string {
          public:
              using std::string::string;
              FakeWxString(const wchar_t* ws) : std::string("") {}
              const char* wx_str() const { return c_str(); }
              bool Empty() const { return empty(); }
              bool IsEmpty() const { return empty(); }
              static FakeWxString Format(const char* f, ...) {
                  char b[4096]; va_list a; va_start(a, f);
                  vsnprintf(b, sizeof(b), f, a); va_end(a);
                  return FakeWxString(b);
              }
          };

          #define wxString FakeWxString
          #define wxEmptyString FakeWxString("")
          typedef std::vector<FakeWxString> wxArrayString;
          inline const char* pxGetTranslation(const char* m) { return m; }
          #endif
          EOF

          for h in string.h log.h setup.h intl.h crt.h filefn.h config.h chartype.h tokenzr.h buffer.h thread.h; do
            echo "#include \"../wx_bridge.h\"" > dummy_wx/wx/$h
          done

          cd build
          # Clear any SSE flags
          find .. -name "CMakeLists.txt" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_SYSTEM_NAME=Darwin \
                   -DCMAKE_OSX_ARCHITECTURES=arm64 \
                   -DUSE_WXWIDGETS=OFF \
                   -DUSE_OPENGL=OFF \
                   -DUSE_VULKAN=ON \
                   -DPCSX2_USE_PCH=OFF \
                   -DCMAKE_CXX_FLAGS="-I${GITHUB_WORKSPACE}/dummy_wx -include ${GITHUB_WORKSPACE}/dummy_wx/wx_bridge.h -Wno-everything" \
                   -DCMAKE_C_FLAGS="-DHAVE_FDOPEN -Wno-everything"

          # Final check on generated flags
          find . -name "flags.make" -exec sed -i '' 's/-mfpmath=sse//g' {} +

          cmake --build . --config Release --verbose -- -j $(sysctl -n hw.logicalcpu)